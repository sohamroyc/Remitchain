<script>
document.addEventListener('DOMContentLoaded', async () => {
    const token = localStorage.getItem('remitchain_token');
    if (!token) {
        window.location.href = 'authentication_phone_otp.html';
        return;
    }

    const container = document.querySelector('.space-y-4');
    
    async function loadTransactions() {
        try {
            const res = await fetch('http://localhost:5000/api/transactions', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const transactions = await res.json();
            renderTransactions(transactions);
        } catch (err) {
            console.error('Failed to load transactions:', err);
        }
    }

    function renderTransactions(transactions) {
        if (!transactions || transactions.length === 0) {
            container.innerHTML = '<div class="text-center py-20 text-slate-400 font-medium">No transactions found</div>';
            return;
        }
        
        container.innerHTML = '';
        
        const groups = transactions.reduce((acc, tx) => {
            const date = new Date(tx.createdAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            if (!acc[date]) acc[date] = [];
            acc[date].push(tx);
            return acc;
        }, {});

        Object.keys(groups).forEach(date => {
            const sep = document.createElement('div');
            sep.className = 'flex items-center gap-4 py-4';
            sep.innerHTML = `
                <span class="text-[10px] font-bold tracking-[0.2em] text-outline uppercase whitespace-nowrap">${date}</span>
                <div class="h-[1px] w-full bg-outline-variant/20"></div>
            `;
            container.appendChild(sep);

            groups[date].forEach(tx => {
                const time = new Date(tx.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const card = document.createElement('div');
                card.className = 'bg-surface-container-lowest p-5 md:p-6 rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.02)] group cursor-pointer hover:shadow-[0_10px_40px_rgba(0,0,0,0.06)] transition-all duration-300';
                card.innerHTML = `
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="flex items-center gap-5">
                            <div class="w-14 h-14 rounded-2xl ${tx.amount > 0 ? 'bg-secondary/10 text-secondary' : 'bg-primary-container text-white'} flex items-center justify-center shrink-0">
                                <span class="material-symbols-outlined text-2xl">${tx.amount > 0 ? 'south_west' : 'north_east'}</span>
                            </div>
                            <div>
                                <h4 class="font-headline text-lg font-bold text-primary">${tx.recipient || 'Transfer'}</h4>
                                <p class="text-on-surface-variant text-sm flex items-center gap-2 mt-0.5">
                                    <span class="material-symbols-outlined text-xs">schedule</span>
                                    ${time} • ${tx.type || 'Blockchain Transfer'}
                                </p>
                            </div>
                        </div>
                        <div class="flex flex-row md:flex-col items-end justify-between md:justify-center gap-1">
                            <div class="text-right">
                                <span class="font-headline text-xl font-extrabold ${tx.amount > 0 ? 'text-secondary' : 'text-primary'} block">${tx.amount > 0 ? '+' : ''}${Math.abs(tx.amount).toLocaleString()} ${tx.currency || 'AED'}</span>
                            </div>
                            <div class="mt-2 md:mt-1">
                                <span class="bg-${tx.status === 'COMPLETED' ? 'secondary/10 text-secondary' : 'amber-100 text-amber-700'} text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-widest">${tx.status}</span>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        });
    }

    loadTransactions();
});
</script>
